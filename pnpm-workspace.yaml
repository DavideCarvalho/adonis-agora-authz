packages:
  - "packages/*"
# pnpm >= 10 nao roda build script de dependencia sem permissao explicita, e em CI ele
# ERRA (ERR_PNPM_IGNORED_BUILDS) em vez de so avisar -- o release morre no
# `pnpm install --frozen-lockfile` antes de chegar no changesets. Todos estes ja rodavam
# sob o pnpm 9 (biome/swc/esbuild/better-sqlite3/sharp compilam ou baixam binario), entao
# liberar preserva o comportamento; nao e permissao nova.
allowBuilds:
  '@biomejs/biome': true
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
  # testcontainers traz estes transitivos com build scripts de natives OPCIONAIS
  # (ssh2/cpu-features têm fallback puro-JS; o postinstall do protobufjs só
  # traz helpers de CLI). Negar explicitamente cala o ERR_PNPM_IGNORED_BUILDS do
  # CI sem compilar nada que os testes de containers precisem.
  cpu-features: false
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - '@types/node@26.5.0'
  - unplugin-swc@1.6.0
  - '@adonis-agora/authkit-client@1.0.0-rc.7 || 1.0.0'
  - '@adonis-agora/authkit-core@1.0.0-rc.3 || 1.0.0'
  - '@adonis-agora/diagnostics@1.0.0'

# Skill examples are typechecked by `intent validate` from the repo root, so a package they import
# must resolve from the root node_modules. These are already in the workspace (devDependencies of
# packages/core and packages/react; @adonisjs/auth through @adonis-agora/authkit-client) and hoist
# against the same @adonisjs/core copy the library uses. Install-time only: no published changes.
publicHoistPattern:
  - "@adonis-agora/authkit-client"
  - "@adonisjs/auth"
  - "@adonisjs/bouncer"
  - "@adonisjs/core"
  - "@adonisjs/lucid"
  - "@testing-library/react"
